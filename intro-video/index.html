<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Space Grotesk is not in the renderer's auto-resolved font list, so
         this webfont link is required — without it the render silently
         falls back to a generic sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #071711;
      }

      #scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 70% 60% at 50% 42%, rgba(22, 74, 55, 0.72) 0%, transparent 62%),
          radial-gradient(ellipse 120% 90% at 50% 50%, rgba(11, 42, 32, 0.5) 0%, transparent 70%),
          #071711;
      }

      /* Vignette darkens the backdrop only — it sits beneath the
         foreground so it never dims the crest, name, or subtitle. */
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: radial-gradient(ellipse 88% 78% at 50% 50%, transparent 40%, rgba(2, 8, 6, 0.72) 100%);
      }

      #crest-wrap, #name, #rule, #sub { position: relative; z-index: 1; }

      #rings {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1180px;
        height: 1180px;
        margin: -590px 0 0 -590px;
        color: #c9a961;
      }

      #crest-wrap {
        position: relative;
        width: 210px;
        height: 210px;
        color: #c9a961;
        margin-bottom: 54px;
      }
      #crest { width: 100%; height: 100%; overflow: visible; }

      #monogram {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: 62px;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #e6cf9a;
        padding-top: 2px;
      }

      #name {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: 124px;
        font-weight: 600;
        letter-spacing: -0.04em;
        color: #efe9dc;
        line-height: 1;
        white-space: nowrap;
      }
      #name .ch { display: inline-block; }

      #rule {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 26px;
        width: 620px;
        margin: 46px 0 40px;
      }
      #rule .rl {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, #c9a961);
        transform-origin: right center;
      }
      #rule .rl:last-child {
        background: linear-gradient(90deg, #c9a961, transparent);
        transform-origin: left center;
      }
      #rule i { color: #c9a961; font-style: normal; font-size: 20px; }

      #sub {
        font-family: "JetBrains Mono", monospace;
        font-size: 26px;
        font-weight: 400;
        letter-spacing: 0.46em;
        text-transform: uppercase;
        color: #9a7d40;
        text-indent: 0.46em;
      }

      /* Resolves to the exact site background so the handoff is invisible */
      #settle {
        position: absolute;
        inset: 0;
        background: #071711;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <!-- Rotating dashed rings sweep past the viewBox edge by design. -->
        <svg id="rings" viewBox="0 0 600 600" fill="none" aria-hidden="true" data-layout-allow-overflow>
          <circle id="ring-a" cx="300" cy="300" r="238" stroke="currentColor" stroke-width="0.7" opacity="0.42" />
          <circle id="ring-b" cx="300" cy="300" r="196" stroke="currentColor" stroke-width="0.5" opacity="0.26" />
          <circle id="ring-c" cx="300" cy="300" r="284" stroke="currentColor" stroke-width="0.5" opacity="0.2"
                  stroke-dasharray="2 11" />
          <circle id="ring-d" cx="300" cy="300" r="264" stroke="currentColor" stroke-width="0.6" opacity="0.3"
                  stroke-dasharray="1 26" />
        </svg>

        <div id="crest-wrap">
          <svg id="crest" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path
              id="crest-outer"
              d="M24 2 L44 12 V28 C44 38 34 44 24 46 C14 44 4 38 4 28 V12 Z"
              stroke="currentColor"
              stroke-width="1.1"
            />
            <path
              id="crest-inner"
              d="M24 6 L40 14 V28 C40 36 32 41 24 42.6 C16 41 8 36 8 28 V14 Z"
              stroke="currentColor"
              stroke-width="0.5"
              opacity="0.55"
            />
          </svg>
          <div id="monogram">RS</div>
        </div>

        <h1 id="name">Rajiv Silva</h1>

        <div id="rule">
          <span class="rl"></span><i>&#10022;</i><span class="rl"></span>
        </div>

        <p id="sub">Quality Engineering &amp; Applied AI</p>

        <div id="vignette"></div>
        <div id="settle"></div>
      </div>
    </div>

    <script>
      /* Split the name into characters up front so the timeline is
         fully deterministic when the renderer seeks frame by frame. */
      (function splitName() {
        const el = document.getElementById("name");
        const text = el.textContent.trim();
        el.textContent = "";
        for (const ch of text) {
          const span = document.createElement("span");
          span.className = "ch";
          span.textContent = ch === " " ? " " : ch;
          el.appendChild(span);
        }
      })();

      /* Prepare the crest strokes for a draw-on effect. */
      ["crest-outer", "crest-inner"].forEach(function (id) {
        const path = document.getElementById(id);
        const len = path.getTotalLength();
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
      });

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* ── Rings settle in ────────────────────────────────── */
      tl.fromTo("#rings",
        { opacity: 0, scale: 1.16, rotate: -8 },
        { opacity: 1, scale: 1, rotate: 0, duration: 2.2, ease: "power3.out" }, 0);

      /* svgOrigin pins rotation to SVG user space (the circle's centre).
         transformOrigin would be measured from each path's own bounding
         box instead, which makes the rings orbit rather than spin. */
      tl.fromTo("#ring-d",
        { rotate: 0 },
        { rotate: 44, duration: 6, ease: "none", svgOrigin: "300 300" }, 0);

      tl.fromTo("#ring-c",
        { rotate: 0 },
        { rotate: -26, duration: 6, ease: "none", svgOrigin: "300 300" }, 0);

      /* ── Crest draws itself ─────────────────────────────── */
      tl.to("#crest-outer", { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, 0.25);
      tl.to("#crest-inner", { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 0.55);

      tl.fromTo("#monogram",
        { opacity: 0, scale: 0.72 },
        { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, 1.25);

      /* ── Name rises, character by character ─────────────── */
      tl.fromTo("#name .ch",
        { opacity: 0, yPercent: 55 },
        { opacity: 1, yPercent: 0, duration: 1, ease: "power3.out", stagger: 0.045 }, 1.75);

      /* ── Rule opens outward ─────────────────────────────── */
      tl.fromTo("#rule .rl",
        { scaleX: 0 },
        { scaleX: 1, duration: 1.1, ease: "power3.inOut" }, 2.5);

      tl.fromTo("#rule i",
        { opacity: 0, scale: 0, rotate: -180 },
        { opacity: 1, scale: 1, rotate: 0, duration: 0.8, ease: "back.out(2)" }, 2.6);

      /* ── Subtitle ───────────────────────────────────────── */
      tl.fromTo("#sub",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 3.0);

      /* ── Hold, then resolve into the site background ────── */
      tl.to("#scene > *:not(#settle):not(#vignette)",
        { opacity: 0, duration: 0.85, ease: "power2.inOut" }, 5.0);

      tl.to("#settle", { opacity: 1, duration: 0.9, ease: "power2.inOut" }, 5.1);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
